name: CI

on:
  push:
    branches: [ "master", "main", "claude/**" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    name: Build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Build and test the embedded MVP and everything it depends on. The default profile excludes
      # the (now removed) WildFly modules. Notes on the flags:
      #  - javadoc is skipped: the sources carry legacy pre-HTML5 javadoc the modern doclet rejects.
      #  - basepom static-analysis checks are skipped: the parent (basepom-oss:32) pins bytecode
      #    analysis plugins (maven-dependency-plugin, illegal-transitive-dependency-check) whose
      #    bundled ASM cannot read Java 25 (major version 69) class files. Unit tests still run.
      - name: Build & test embedded runtime
        run: mvn -B -Dmaven.javadoc.skip=true -Dbasepom.check.skip-all=true -pl embedded -am install
