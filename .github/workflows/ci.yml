name: CI

on:
  push:
    branches: [ "master", "main", "claude/**" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]
    name: Build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Build the embedded MVP and everything it depends on. The default profile excludes the
      # (now removed) WildFly modules; javadoc is skipped because the sources carry legacy
      # pre-HTML5 javadoc that the JDK 25 doclet rejects. The whole reactor compiles to
      # Java 25 bytecode (project.build.targetJdk=25), so the build requires a JDK 25 toolchain.
      - name: Build & test embedded runtime
        run: mvn -B -Dmaven.javadoc.skip=true -pl embedded -am install
